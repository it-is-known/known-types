# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["lib/*"]
default-members = ["lib/*"]
resolver = "2"

[workspace.package]
version = "0.1.4"
authors = ["Arto Bendiken"]
edition = "2024"
#rust-version = "1.85"
description = "Well-known types."
#documentation = "https://docs.rs/known-types"
readme = true
homepage = "https://github.com/it-is-known/known-types"
repository = "https://github.com/it-is-known/known-types"
license = "Unlicense"
keywords = ["known", "known-types", "struct", "types"]
categories = [
    "api-bindings",
    "config",
    "data-structures",
    "rust-patterns",
    "no-std",
]
publish = true

[workspace.dependencies]
known-types = { version = "0.1.4", path = "lib/known-types", default-features = false }

async-graphql = { version = "7.2", default-features = false, features = [] }
bincode = { version = "2", default-features = false, features = ["derive"] }
borsh = { version = "1.8", default-features = false, features = ["derive"] }
derive_more = { version = "2", default-features = false, features = ["display"] }
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
libsql = { version = "0.9", default-features = false }
musli = { version = "0.1", default-features = false }
percent-encoding = { version = "2.3", default-features = false, features = ["alloc"] }
rasn = { version = "0.28", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sqlx = { version = "0.9", default-features = false, features = ["derive"] }
unicase = { version = "2.9", default-features = false }

[patch.crates-io]
known-types = { path = "lib/known-types" }
