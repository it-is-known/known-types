[package]
name = "known-types-ietf"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Well-known types for IETF specifications."
#documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["known-types", "ietf", "standards", "serde"]
categories.workspace = true
publish.workspace = true

[features]
default = ["all", "std"]
all = []
alloc = ["musli?/alloc", "serde?/alloc"]
std = [
    "alloc",
    "borsh?/std",
    "musli?/std",
    "serde?/std",
]
unstable = []

# Interoperability:
sqlx = ["dep:sqlx", "std"]

[dependencies]

# Interoperability:
async-graphql = { workspace = true, optional = true }
borsh = { workspace = true, optional = true }
libsql = { workspace = true, optional = true }
musli = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
