# See: https://docs.github.com/en/actions/writing-workflows
---
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-async-graphql:
    name: Check async-graphql (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - async-graphql
          - default,async-graphql
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test handle integrations
        working-directory: rust
        run: >-
          cargo test --no-default-features --features "${{ matrix.features }}"
          -p known-types-x
          -p known-types-facebook
          -p known-types-github
          -p known-types-gravatar
          -p known-types-instagram
          -p known-types-introco
          -p known-types-linkedin
          -p known-types-localai
          -p known-types-luma
          -p known-types-telegram
          -p known-types-whatsapp

  check-sqlx:
    name: Check SQLx (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - sqlx
          - sqlx-postgres
          - sqlx-mysql
          - sqlx-sqlite
          - sqlx-postgres,sqlx-mysql,sqlx-sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test handle integrations
        working-directory: rust
        run: >-
          cargo test --no-default-features --features "${{ matrix.features }}"
          -p known-types-x
          -p known-types-facebook
          -p known-types-github
          -p known-types-gravatar
          -p known-types-instagram
          -p known-types-introco
          -p known-types-linkedin
          -p known-types-localai
          -p known-types-luma
          -p known-types-telegram
          -p known-types-whatsapp

  check-targets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    name: Check ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        id: install-rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt
      - name: Build library (default features)
        if: ${{ always() }}
        run: cd rust && cargo +${{ steps.install-rust.outputs.name }} check --workspace --keep-going --lib
      - name: Build library (no default features)
        if: ${{ always() }}
        run: cd rust && cargo +${{ steps.install-rust.outputs.name }} check --workspace --keep-going --lib --no-default-features
      #- name: Build library (all features)
      #  if: ${{ always() }}
      #  run: cd rust && cargo +${{ steps.install-rust.outputs.name }} check --workspace --keep-going --lib --all-features
      - name: Build library (all features, no std)
        if: ${{ always() }}
        run: cd rust && cargo +${{ steps.install-rust.outputs.name }} check --workspace --keep-going --lib --no-default-features --features "all"
      - name: Build library (only std)
        if: ${{ always() }}
        run: cd rust && cargo +${{ steps.install-rust.outputs.name }} check --workspace --keep-going --lib --no-default-features --features "std"
      - name: Build examples
        run: cd rust && cargo +${{ steps.install-rust.outputs.name }} check --workspace --keep-going --examples
      - name: Build tests
        id: check-tests
        run: cd rust && cargo +${{ steps.install-rust.outputs.name }} check --workspace --keep-going --tests
      - name: Run tests
        id: run-tests
        if: ${{ steps.check-tests.outcome == 'success' }}
        run: cd rust && cargo +${{ steps.install-rust.outputs.name }} test --workspace --tests --no-fail-fast
